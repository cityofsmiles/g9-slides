<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Grade 9 Math Lessons</title>
<style>
  :root{
    --ink:#121417;
    --ink-2:#1b1e23;
    --ink-3:#262a31;
    --paper:#eef0ee;
    --paper-dim:#9aa3a8;
    --chalk:#e8b94e;
    --chalk-dim:#7a6329;
    --slate:#5ec9c0;
    --danger:#e0654f;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--ink); color:var(--paper);
    font-family:var(--sans); overscroll-behavior:none;
  }
  #app{position:fixed; inset:0; overflow:hidden;}

  /* ---------- Library screen ---------- */
  #library{
    position:absolute; inset:0; overflow-y:auto;
    padding: max(28px, env(safe-area-inset-top)) 20px 40px;
    display:flex; flex-direction:column;
  }
  .brand{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:22px; padding-bottom:16px; border-bottom:1px solid var(--ink-3);
  }
  .brand h1{
    font-size:20px; margin:0; font-weight:700; letter-spacing:0.01em; color:var(--paper);
  }
  .brand h1 span{color:var(--chalk);}
  .brand small{font-family:var(--mono); color:var(--paper-dim); font-size:11px;}

  #termTabs{display:flex; gap:6px; margin-bottom:16px;}
  .term-tab{
    flex:1; text-align:center; font-family:var(--mono); font-size:12px; letter-spacing:0.03em;
    background:var(--ink-2); border:1px solid var(--ink-3); color:var(--paper-dim);
    padding:9px 6px; border-radius:7px; cursor:pointer;
  }
  .term-tab.active{border-color:var(--chalk-dim); color:var(--chalk); background:var(--ink-3);}
  .term-tab.failed{color:var(--danger); opacity:0.6;}

  #search{
    width:100%; background:var(--ink-2); border:1px solid var(--ink-3); color:var(--paper);
    padding:12px 14px; border-radius:8px; font-size:15px; margin-bottom:18px; font-family:var(--sans);
  }
  /* Visible focus for D-pad navigation (LG remote) */
  .row:focus, .term-tab:focus, #search:focus, .hud-btn:focus,
  #status button:focus, #viewerEmpty button:focus{
    outline:3px solid var(--chalk); outline-offset:3px;
  }
  .row:focus{outline-offset:-3px; background:var(--ink-2);}
  .term-tab:hover{border-color:var(--chalk-dim);}
  #search::placeholder{color:var(--paper-dim);}

  #status{
    font-family:var(--mono); font-size:12px; color:var(--paper-dim);
    padding:14px 0; display:flex; align-items:center; gap:8px;
  }
  #status.err{color:var(--danger);}
  #status button{
    background:none; border:1px solid var(--ink-3); color:var(--paper); border-radius:6px;
    padding:5px 10px; font-family:var(--mono); font-size:11px; cursor:pointer; margin-left:6px;
  }
  #status button:hover{border-color:var(--chalk-dim); color:var(--chalk);}

  #list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px;}
  .row{
    display:flex; align-items:center; gap:14px;
    padding:16px 4px; border-bottom:1px solid var(--ink-2);
    cursor:pointer; background:transparent; transition:background 0.12s;
  }
  .row:active, .row:hover{background:var(--ink-2);}
  .row .num{
    font-family:var(--mono); font-size:13px; color:var(--chalk); min-width:52px;
    flex-shrink:0;
  }
  .row .title{font-size:16px; color:var(--paper); flex:1; line-height:1.3;}
  .row .go{color:var(--paper-dim); font-size:18px; flex-shrink:0;}
  .row.hidden{display:none;}

  .empty{color:var(--paper-dim); font-size:13px; padding:20px 4px; font-family:var(--mono);}

  /* ---------- Viewer screen ---------- */
  #viewer{
    position:absolute; inset:0; background:#000; display:none;
    align-items:center; justify-content:center; touch-action:none;
  }
  #viewer.active{display:flex;}
  #slideImg{
    max-width:100%; max-height:100%; width:auto; height:auto; user-select:none;
    -webkit-user-drag:none; object-fit:contain;
  }
  #slideImg.hidden{visibility:hidden;}

  .zone{position:absolute; top:0; bottom:0; width:35%; z-index:5;}
  .zone.left{left:0;}
  .zone.right{right:0;}

  #hud{
    position:absolute; inset:0; z-index:10; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    opacity:1; transition:opacity 0.35s;
  }
  #hud.dim{opacity:0;}
  #hud.dim .hud-top, #hud.dim .hud-bottom{pointer-events:none;}
  .hud-top{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding: max(16px, env(safe-area-inset-top)) 16px 24px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
    pointer-events:auto;
  }
  .hud-top .lesson-title{
    font-size:14px; color:var(--paper); font-weight:600; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .hud-btn{
    background:rgba(255,255,255,0.08); border:none; color:var(--paper);
    width:36px; height:36px; border-radius:8px; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .hud-btn:active{background:rgba(255,255,255,0.18);}
  .hud-bottom{
    display:flex; align-items:center; justify-content:center; gap:16px;
    padding: 20px 16px max(20px, env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    pointer-events:auto;
  }
  #counter{font-family:var(--mono); font-size:13px; color:var(--paper-dim); letter-spacing:0.02em;}
  #counter b{color:var(--chalk); font-weight:600;}

  #remoteDot{
    width:8px; height:8px; border-radius:50%; background:var(--ink-3);
    flex-shrink:0; margin-right:2px;
  }
  #remoteDot.connected{background:var(--slate);}
  #remoteDot.error{background:var(--danger);}

  #loading{
    position:absolute; inset:0; z-index:15; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:10px;
    background:#000; color:var(--paper-dim); font-family:var(--mono); font-size:12px;
  }
  #loading.active{display:flex;}
  .spinner{
    width:22px; height:22px; border-radius:50%;
    border:2px solid var(--ink-3); border-top-color:var(--chalk);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  #viewerEmpty{
    position:absolute; inset:0; z-index:15; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:10px;
    background:#000; color:var(--paper-dim); text-align:center; padding:30px;
  }
  #viewerEmpty.active{display:flex;}
  #viewerEmpty .big{color:var(--danger); font-size:14px; font-family:var(--mono);}
  #viewerEmptyDetail{font-family:var(--mono); font-size:11px; word-break:break-all;}
  #viewerEmpty button{
    margin-top:8px; background:var(--ink-2); border:1px solid var(--ink-3); color:var(--paper);
    padding:9px 16px; border-radius:8px; font-family:var(--mono); font-size:12px; cursor:pointer;
  }

  /* ---------- TV scale (webOS browser reports ~1920px wide) ---------- */
  @media (min-width: 1600px){
    #library{padding:max(48px, env(safe-area-inset-top)) 96px 64px; align-items:center;}
    #library > *{width:100%; max-width:1400px;}
    .brand{margin-bottom:32px; padding-bottom:24px;}
    .brand h1{font-size:44px;}
    .brand small{font-size:24px;}
    #termTabs{gap:12px; margin-bottom:24px;}
    .term-tab{font-size:26px; padding:20px 12px; border-radius:12px;}
    #search{font-size:28px; padding:22px 28px; border-radius:12px; margin-bottom:28px;}
    #status{font-size:24px; gap:14px;}
    #status button{font-size:22px; padding:12px 20px; border-radius:10px;}
    .row{gap:28px; padding:28px 20px;}
    .row .num{font-size:26px; min-width:120px;}
    .row .title{font-size:32px;}
    .row .go{font-size:36px;}
    .empty{font-size:24px; padding:32px 8px;}
    .hud-top{gap:20px; padding:max(32px, env(safe-area-inset-top)) 56px 40px;}
    .hud-top .lesson-title{font-size:28px;}
    .hud-btn{width:64px; height:64px; font-size:30px; border-radius:12px;}
    .hud-bottom{padding:32px 56px max(32px, env(safe-area-inset-bottom));}
    #counter{font-size:26px;}
    #remoteDot{width:14px; height:14px;}
    #loading{font-size:22px; gap:16px;}
    .spinner{width:40px; height:40px; border-width:3px;}
    #viewerEmpty .big{font-size:28px;}
    #viewerEmptyDetail{font-size:20px;}
    #viewerEmpty button{font-size:22px; padding:14px 26px;}
  }

  @media (prefers-reduced-motion: reduce){
    #hud, .spinner{transition:none; animation:none;}
  }
</style>
</head>
<body>

<div id="app">

  <!-- LIBRARY -->
  <div id="library">
    <div class="brand">
      <h1>Grade 9 <span>Math Lessons</span></h1>
      <small id="count-badge"></small>
    </div>
    <div id="termTabs"></div>
    <input id="search" type="text" placeholder="Search lessons…" autocomplete="off">
    <div id="status">Loading lesson list…</div>
    <ul id="list"></ul>
  </div>

  <!-- VIEWER -->
  <div id="viewer">
    <img id="slideImg" alt="Slide">
    <div class="zone left" id="zoneLeft"></div>
    <div class="zone right" id="zoneRight"></div>

    <div id="loading"><div class="spinner"></div><div>finding slides…</div></div>
    <div id="viewerEmpty">
      <div class="big">No slides found in this folder</div>
      <div id="viewerEmptyDetail"></div>
      <button id="backFromEmpty">Back to list</button>
    </div>

    <div id="hud">
      <div class="hud-top">
        <button class="hud-btn" id="btnClose" aria-label="Close">✕</button>
        <div class="lesson-title" id="hudTitle"></div>
        <span id="remoteDot" title="Kindle remote connection"></span>
        <button class="hud-btn" id="btnFullscreen" aria-label="Fullscreen">⛶</button>
      </div>
      <div class="hud-bottom">
        <span id="counter"><b id="curNum">0</b> / <span id="totalNum">0</span></span>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  'use strict';

  // ---------------- CONFIG ----------------
  // Edit these if you reuse this file for a different sheet or set of tabs.
  const SHEET_ID  = '1M_8gqOK-OUJ2bPeMU0fgYfx5k9lJBFT9ZRA59tGoJ4c';
  const TERMS = ['Term1', 'Term2', 'Term3'];  // must match your sheet tab names exactly
  const MAX_SLIDES_TO_PROBE = 250;  // safety ceiling per lesson
  const HUD_HIDE_DELAY = 2600;     // ms of inactivity before HUD fades in viewer

  // Remote control (Kindle) — must match REMOTE_TOPIC in kindle-remote.html exactly.
  // ntfy.sh topics are unauthenticated and public if guessed, so pick something
  // obscure rather than leaving the default.
  const REMOTE_TOPIC = 'kasamath-g9-slides-9f3k2';
  const ENABLE_REMOTE = true;
  // -----------------------------------------

  function csvUrlForTerm(term){
    return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(term)}`;
  }

  const el = (id) => document.getElementById(id);
  const statusEl = el('status'), listEl = el('list'), searchEl = el('search'), countBadge = el('count-badge');
  const termTabsEl = el('termTabs');
  const viewer = el('viewer'), library = el('library'), slideImg = el('slideImg');
  const hud = el('hud'), hudTitle = el('hudTitle'), curNum = el('curNum'), totalNum = el('totalNum');
  const loadingEl = el('loading'), emptyEl = el('viewerEmpty'), emptyDetail = el('viewerEmptyDetail');

  let lessons = [];          // all terms combined: {term, number, title, folderPath}
  let termStatus = {};        // term -> 'ok' | 'failed'
  let activeTerm = TERMS[0];
  let slideCache = {};        // folderPath -> [urls]
  let current = { urls: [], index: 0, title: '' };
  let openToken = 0;          // increments on every lesson open / close
  let hudTimer = null;
  let libraryScroll = 0;      // restore list position after closing a lesson
  let lastOpenedEl = null;    // row that opened the current lesson (for focus restore)
  let viewerHistory = false;  // true while a history entry is pushed for the viewer
  let lastInputWasKey = false;

  // ---------- CSV parsing (handles quoted fields) ----------
  function parseCSV(text){
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i], next = text[i+1];
      if (inQuotes){
        if (c === '"' && next === '"'){ field += '"'; i++; }
        else if (c === '"'){ inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"'){ inQuotes = true; }
        else if (c === ','){ row.push(field); field = ''; }
        else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
        else if (c === '\r'){ /* skip */ }
        else { field += c; }
      }
    }
    if (field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(f => f.trim() !== ''));
  }

  function extractLessonNumber(title, folderPath){
    // Prefer a dotted numeric run from the folder path (e.g. .../1.07.1) —
    // falls back to scanning the title if the path doesn't have one.
    let m = folderPath.match(/([0-9]+(?:\.[0-9]+)+)/);
    if (m) return m[1];
    m = title.match(/([0-9]+(?:\.[0-9]+)+)/);
    return m ? m[1] : '';
  }

  function githubTreeToRawBase(treeUrl){
    // https://github.com/OWNER/REPO/tree/BRANCH/path/to/folder
    //   -> https://raw.githubusercontent.com/OWNER/REPO/BRANCH/path/to/folder/
    const m = treeUrl.match(/github\.com\/([^\/]+)\/([^\/]+)\/tree\/([^\/]+)\/(.+?)\/?$/);
    if (!m) return null;
    const [, owner, repo, branch, path] = m;
    return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}/`;
  }

  function loadImage(url){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(url);
      img.onerror = () => reject(url);
      img.src = url;
    });
  }

  // Progressive probe: resolves as soon as slide 1 loads, then keeps discovering
  // the rest in the background (a few at a time). entry.urls grows in place, so
  // current.urls always sees new slides as they are found.
  const PROBE_BATCH = 4;
  function probeSlides(folderPath, onProgress){
    let entry = slideCache[folderPath];
    if (entry){
      if (onProgress && !entry.done) entry.listeners.push(onProgress);
      return entry.first;
    }
    const base = githubTreeToRawBase(folderPath);
    if (!base) return Promise.reject(new Error('not-a-github-tree-url'));

    entry = slideCache[folderPath] = { urls: [], done: false, listeners: onProgress ? [onProgress] : [] };
    const urlFor = n => `${base}slide-${String(n).padStart(2, '0')}.png`;

    entry.first = (async () => {
      try { await loadImage(urlFor(1)); entry.urls.push(urlFor(1)); }
      catch (e) { /* no slide 1: empty lesson */ }
      if (!entry.urls.length){ entry.done = true; return entry; }
      // continue in background (not awaited by the caller)
      (async () => {
        let n = 2;
        while (n <= MAX_SLIDES_TO_PROBE){
          const batch = [];
          for (let k = n; k < n + PROBE_BATCH && k <= MAX_SLIDES_TO_PROBE; k++){
            batch.push(loadImage(urlFor(k)).then(() => true, () => false));
          }
          const results = await Promise.all(batch);
          let ended = false;
          for (let i = 0; i < results.length; i++){
            if (!results[i]){ ended = true; break; }  // first miss = end of sequence
            entry.urls.push(urlFor(n + i));
          }
          entry.listeners.forEach(fn => { try { fn(entry); } catch (e) {} });
          if (ended) break;
          n += PROBE_BATCH;
        }
        entry.done = true;
        entry.listeners.forEach(fn => { try { fn(entry); } catch (e) {} });
        entry.listeners = [];
      })();
      return entry;
    })();
    return entry.first;
  }

  // ---------- Library rendering ----------
  function renderTabs(){
    termTabsEl.innerHTML = '';
    TERMS.forEach(term => {
      const btn = document.createElement('div');
      btn.className = 'term-tab' + (term === activeTerm ? ' active' : '') + (termStatus[term] === 'failed' ? ' failed' : '');
      btn.textContent = term;
      btn.tabIndex = 0;
      btn.setAttribute('role', 'tab');
      btn.addEventListener('click', () => {
        if (term === activeTerm) return;
        const hadFocus = document.activeElement === btn;
        activeTerm = term;
        searchEl.value = '';
        renderTabs();
        renderList();
        if (hadFocus) termTabsEl.children[TERMS.indexOf(term)].focus();
      });
      termTabsEl.appendChild(btn);
    });
  }

  function visibleLessons(){
    return lessons.filter(l => l.term === activeTerm);
  }

  function renderList(){
    listEl.innerHTML = '';
    const termLessons = visibleLessons();
    if (!termLessons.length){
      const msg = termStatus[activeTerm] === 'failed'
        ? `Couldn't load the "${activeTerm}" tab.`
        : `No lessons found in "${activeTerm}".`;
      listEl.innerHTML = `<li class="empty">${msg}</li>`;
      countBadge.textContent = '';
      return;
    }
    termLessons.forEach((lesson) => {
      const li = document.createElement('li');
      li.className = 'row';
      li.innerHTML = `<span class="num">${lesson.number || '—'}</span><span class="title">${escapeHtml(lesson.title)}</span><span class="go">›</span>`;
      li.tabIndex = 0;
      li.setAttribute('role', 'button');
      li.addEventListener('click', () => openLessonData(lesson, li));
      listEl.appendChild(li);
    });
    countBadge.textContent = `${termLessons.length} lesson${termLessons.length === 1 ? '' : 's'}`;
    filterList(searchEl.value);
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function filterList(q){
    q = q.trim().toLowerCase();
    const termLessons = visibleLessons();
    document.querySelectorAll('#list .row').forEach((row, i) => {
      const lesson = termLessons[i];
      if (!lesson) return;
      const match = !q || lesson.title.toLowerCase().includes(q) || lesson.number.includes(q);
      row.classList.toggle('hidden', !match);
    });
  }

  searchEl.addEventListener('input', () => filterList(searchEl.value));

  // ---------- Load sheet ----------
  async function loadSheet(){
    statusEl.textContent = 'Loading lesson list…';
    statusEl.className = '';
    renderTabs();

    const results = await Promise.all(TERMS.map(async (term) => {
      try {
        const res = await fetch(csvUrlForTerm(term));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const rows = parseCSV(text);
        if (!rows.length) throw new Error('empty');
        const dataRows = rows.slice(1); // skip header
        const termLessons = dataRows
          .map(r => ({ title: (r[0] || '').trim(), folderPath: (r[1] || '').trim() }))
          .filter(l => l.title && l.folderPath)
          .map(l => ({ ...l, term, number: extractLessonNumber(l.title, l.folderPath) }));
        termStatus[term] = 'ok';
        return termLessons;
      } catch (err) {
        termStatus[term] = 'failed';
        return [];
      }
    }));

    lessons = results.flat();
    const anyFailed = TERMS.some(t => termStatus[t] === 'failed');
    const anyOk = TERMS.some(t => termStatus[t] === 'ok');

    if (!anyOk){
      statusEl.className = 'err';
      statusEl.innerHTML = `Couldn't load any lesson tabs. Make sure the sheet is shared as "Anyone with the link can view" and that tab names match ${TERMS.join(', ')}. <button id="retryBtn">Retry</button>`;
      el('retryBtn').addEventListener('click', loadSheet);
      renderTabs();
      renderList();
      return;
    }

    statusEl.textContent = anyFailed ? `Some tabs failed to load (marked in red above).` : '';
    statusEl.className = anyFailed ? 'err' : '';
    renderTabs();
    renderList();
  }

  // ---------- Viewer ----------
  async function openLessonData(lesson, rowEl){
    if (!lesson || !lesson.folderPath) return;
    if (!viewer.classList.contains('active')){
      libraryScroll = library.scrollTop;
      lastOpenedEl = rowEl || null;
    }
    pushViewerState();
    current.urls = []; current.index = 0;
    current.title = lesson.title;
    hudTitle.textContent = lesson.title;
    viewer.classList.add('active');
    library.style.display = 'none';
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    loadingEl.classList.add('active');
    emptyEl.classList.remove('active');
    slideImg.classList.add('hidden');

    const myOpen = ++openToken;   // ignore late results if the user left / opened another lesson
    let entry;
    try {
      entry = await probeSlides(lesson.folderPath, (en) => {
        if (myOpen === openToken) totalNum.textContent = en.urls.length;
      });
    } catch (e) {
      entry = { urls: [] };
    }
    if (myOpen !== openToken) return;
    loadingEl.classList.remove('active');

    if (!entry.urls.length){
      emptyDetail.textContent = lesson.folderPath;
      emptyEl.classList.add('active');
      return;
    }

    current.urls = entry.urls;    // same array; grows as more slides are found
    current.index = 0;
    totalNum.textContent = entry.urls.length;
    showSlide(0);
    attemptFullscreen();
    scheduleHudHide();
  }

  function showSlide(i){
    if (i < 0 || i >= current.urls.length) return;
    current.index = i;
    slideImg.src = current.urls[i];
    slideImg.classList.remove('hidden');
    curNum.textContent = i + 1;
    // preload neighbors
    [i-1, i+1, i+2].forEach(n => {
      if (n >= 0 && n < current.urls.length){
        const pre = new Image();
        pre.src = current.urls[n];
      }
    });
  }

  function nextSlide(){ if (current.index < current.urls.length - 1) showSlide(current.index + 1); wakeHud(); }
  function prevSlide(){ if (current.index > 0) showSlide(current.index - 1); wakeHud(); }

  function closeViewer(){
    teardownViewer();
    if (viewerHistory){
      viewerHistory = false;
      try { history.back(); } catch (e) {}
    }
  }

  function teardownViewer(){
    openToken++;   // cancel any pending UI update from an in-flight probe
    viewer.classList.remove('active');
    library.style.display = '';
    library.scrollTop = libraryScroll;
    exitFullscreenSafe();
    clearTimeout(hudTimer);
    restoreFocus();
  }

  // Keyboard/D-pad users land back on the lesson they opened. Fullscreen exit
  // is asynchronous and the page is inert until it finishes, so retry then.
  function restoreFocus(){
    if (!(lastInputWasKey && lastOpenedEl && document.body.contains(lastOpenedEl))) return;
    const target = lastOpenedEl;
    const tryFocus = () => {
      if (!viewer.classList.contains('active') && document.body.contains(target)) target.focus();
    };
    tryFocus();
    if (document.activeElement === target) return;
    let done = false;
    const again = () => {
      if (done) return;
      done = true;
      document.removeEventListener('fullscreenchange', again);
      document.removeEventListener('webkitfullscreenchange', again);
      tryFocus();
    };
    document.addEventListener('fullscreenchange', again);
    document.addEventListener('webkitfullscreenchange', again);
    setTimeout(again, 400);
  }

  // Back button support: the viewer gets its own history entry, so the
  // TV's Back key closes the lesson instead of leaving the page.
  function pushViewerState(){
    if (viewerHistory) return;
    try { history.pushState({ viewer: true }, ''); viewerHistory = true; } catch (e) {}
  }

  window.addEventListener('popstate', () => {
    viewerHistory = false;
    if (viewer.classList.contains('active')) teardownViewer();
  });

  function fsElement(){
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }

  function attemptFullscreen(){
    const req = viewer.requestFullscreen || viewer.webkitRequestFullscreen;
    if (!req) return;
    try {
      const p = req.call(viewer);
      if (p && typeof p.catch === 'function') p.catch(() => {});
    } catch (e) {}
  }

  function exitFullscreenSafe(){
    if (!fsElement()) return;
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (!ex) return;
    try {
      const p = ex.call(document);
      if (p && typeof p.catch === 'function') p.catch(() => {});
    } catch (e) {}
  }

  function toggleFullscreen(){
    if (fsElement()) exitFullscreenSafe(); else attemptFullscreen();
  }

  function wakeHud(){
    hud.classList.remove('dim');
    scheduleHudHide();
  }
  function scheduleHudHide(){
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => hud.classList.add('dim'), HUD_HIDE_DELAY);
  }

  // ---------- Events ----------
  el('zoneLeft').addEventListener('click', prevSlide);
  el('zoneRight').addEventListener('click', nextSlide);
  el('btnClose').addEventListener('click', closeViewer);
  el('btnFullscreen').addEventListener('click', (e) => {
    toggleFullscreen();
    e.currentTarget.blur();   // keep OK/Enter meaning "next slide"
  });
  el('backFromEmpty').addEventListener('click', closeViewer);
  viewer.addEventListener('mousemove', wakeHud);

  // ---------- LG remote: keys ----------
  // keyCode is used (not e.key) because webOS remote keys have no e.key.
  const K = {
    ENTER: 13, ESC: 27, SPACE: 32, PGUP: 33, PGDN: 34,
    LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, F: 70,
    RW: 412, FF: 417, CHUP: 427, CHDN: 428, BACK: 461
  };

  document.addEventListener('mousedown', () => { lastInputWasKey = false; }, true);
  document.addEventListener('touchstart', () => { lastInputWasKey = false; }, { capture: true, passive: true });

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    lastInputWasKey = true;
    if (viewer.classList.contains('active')) handleViewerKey(e, e.keyCode);
    else handleLibraryKey(e, e.keyCode);
  });

  function handleViewerKey(e, k){
    switch (k){
      case K.RIGHT: case K.FF: case K.CHUP: case K.PGDN: case K.SPACE: case K.ENTER:
        e.preventDefault(); nextSlide(); break;
      case K.LEFT: case K.RW: case K.CHDN: case K.PGUP:
        e.preventDefault(); prevSlide(); break;
      case K.UP: case K.DOWN:
        e.preventDefault(); wakeHud(); break;
      case K.ESC: case K.BACK:
        e.preventDefault(); closeViewer(); break;
      case K.F:
        toggleFullscreen(); break;
    }
  }

  // D-pad navigation for the library. Order top to bottom:
  // term tabs -> search -> (retry button) -> lesson rows.
  function handleLibraryKey(e, k){
    const a = document.activeElement;

    // OK / Enter activates rows and tabs (divs don't do this natively).
    if ((k === K.ENTER || k === K.SPACE) && a &&
        (a.classList.contains('row') || a.classList.contains('term-tab'))){
      e.preventDefault();
      a.click();
      return;
    }

    const isNav = k === K.UP || k === K.DOWN || k === K.LEFT || k === K.RIGHT;
    if (!isNav) return;

    // Left/Right inside the search box keep moving the text caret.
    if (a === searchEl && (k === K.LEFT || k === K.RIGHT)) return;

    const tabs = Array.from(termTabsEl.children);
    const rows = Array.from(listEl.querySelectorAll('.row:not(.hidden)'));
    const retry = el('retryBtn');

    // First D-pad press with nothing focused: land on the first lesson.
    if (!a || a === document.body || !library.contains(a)){
      e.preventDefault();
      (rows[0] || tabs[TERMS.indexOf(activeTerm)] || searchEl).focus();
      return;
    }

    const tabIdx = tabs.indexOf(a);
    const rowIdx = rows.indexOf(a);
    let target = null;

    if (k === K.LEFT || k === K.RIGHT){
      if (tabIdx > -1) target = tabs[tabIdx + (k === K.RIGHT ? 1 : -1)];
    } else if (tabIdx > -1){
      if (k === K.DOWN) target = searchEl;
    } else if (a === searchEl){
      target = (k === K.UP) ? tabs[TERMS.indexOf(activeTerm)] : (retry || rows[0]);
    } else if (a === retry){
      target = (k === K.UP) ? searchEl : rows[0];
    } else if (rowIdx > -1){
      if (k === K.DOWN) target = rows[rowIdx + 1];
      else target = rowIdx > 0 ? rows[rowIdx - 1] : (retry || searchEl);
    }

    e.preventDefault();
    if (target) target.focus();
  }

  // Magic Remote scroll wheel flips slides in the viewer.
  let lastWheel = 0;
  viewer.addEventListener('wheel', (e) => {
    e.preventDefault();
    const now = Date.now();
    if (now - lastWheel < 220 || Math.abs(e.deltaY) < 1) return;
    lastWheel = now;
    if (e.deltaY > 0) nextSlide(); else prevSlide();
  }, { passive: false });

  // touch swipe
  let touchStartX = null, touchStartY = null;
  viewer.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  viewer.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
      if (dx < 0) nextSlide(); else prevSlide();
    }
    touchStartX = null; touchStartY = null;
  }, { passive: true });

  // ---------- Kindle remote (ntfy.sh) ----------
  const remoteDot = el('remoteDot');

  function setupRemote(){
    if (!ENABLE_REMOTE || !REMOTE_TOPIC) return;
    let es;
    function connect(){
      try {
        es = new EventSource(`https://ntfy.sh/${REMOTE_TOPIC}/sse`);
      } catch (e) {
        remoteDot.className = 'error';
        return;
      }
      es.onopen = () => { remoteDot.className = 'connected'; };
      es.onerror = () => { remoteDot.className = 'error'; };
      es.onmessage = (e) => {
        let payload;
        try { payload = JSON.parse(e.data); } catch (err) { return; }
        if (!payload || !payload.message) return;
        let cmd;
        try { cmd = JSON.parse(payload.message); } catch (err) { return; }
        handleRemoteCommand(cmd);
      };
    }
    connect();
  }

  function handleRemoteCommand(cmd){
    if (!cmd || !cmd.action) return;
    switch (cmd.action){
      case 'open':
        openLessonData({ title: cmd.title || '', folderPath: cmd.folderPath || '' });
        break;
      case 'next':
        nextSlide();
        break;
      case 'prev':
        prevSlide();
        break;
      case 'goto':
        if (typeof cmd.index === 'number') showSlide(cmd.index);
        wakeHud();
        break;
      case 'close':
        closeViewer();
        break;
    }
  }

  // ---------- Keep the TV screen awake ----------
  // LG webOS may release a Wake Lock while the page is still visible.
  // We therefore:
  //   1. request the Screen Wake Lock when supported;
  //   2. immediately retry when the browser releases it;
  //   3. periodically verify that it is still held;
  //   4. use a muted looping video as a fallback where Wake Lock is unavailable;
  //   5. retry after the page becomes visible again.
  //
  // NOTE: A web page cannot override LG's system-level Energy Saving,
  // Screen Saver, or Auto Power Off settings. Those must be disabled in
  // the TV settings if webOS still puts the display to sleep.

  let wakeLock = null;
  let wakeLockRetryTimer = null;
  let wakeLockWatchTimer = null;
  let wakeLockRequestInProgress = false;

  const WAKE_LOCK_RETRY_MS = 5000;
  const WAKE_LOCK_WATCH_MS = 15000;

  async function requestWakeLock(){
    if (wakeLockRequestInProgress) return !!wakeLock;
    if (!('wakeLock' in navigator)) return false;

    wakeLockRequestInProgress = true;

    try {
      // Don't request a second lock if the current one is still active.
      if (wakeLock && !wakeLock.released) {
        return true;
      }

      wakeLock = await navigator.wakeLock.request('screen');

      wakeLock.addEventListener('release', () => {
        wakeLock = null;
        scheduleWakeLockRetry();
      }, { once: true });

      return true;
    } catch (e) {
      wakeLock = null;
      scheduleWakeLockRetry();
      return false;
    } finally {
      wakeLockRequestInProgress = false;
    }
  }

  function scheduleWakeLockRetry(){
    if (wakeLockRetryTimer) return;

    wakeLockRetryTimer = setTimeout(async () => {
      wakeLockRetryTimer = null;

      if (document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    }, WAKE_LOCK_RETRY_MS);
  }

  function startVideoFallback(){
    let v = document.getElementById('wakeVideo');

    if (!v) {
      v = document.createElement('video');
      v.id = 'wakeVideo';
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      v.muted = true;
      v.defaultMuted = true;
      v.loop = true;
      v.autoplay = true;
      v.preload = 'auto';

      // Keep it effectively invisible without using display:none.
      v.style.cssText =
        'position:fixed; left:-2px; top:-2px; width:2px; height:2px;' +
        'opacity:0.01; pointer-events:none; z-index:-1;';

      // 1x1 transparent, silent, looping MP4.
      v.src =
        'data:video/mp4;base64,' +
        'AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAtVtZGF0AAACrgYF//+q3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE2NCAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMjAgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWwAAAB0ZGF0YQ==';

      document.body.appendChild(v);

      v.addEventListener('ended', () => {
        v.currentTime = 0;
        v.play().catch(() => {});
      });

      v.addEventListener('pause', () => {
        // Some TV browsers pause background/invisible media.
        v.play().catch(() => {});
      });
    }

    v.play().catch(() => {});
    return v;
  }

  async function initWakeLock(){
    // Always initialize the fallback as well. It is harmless when Wake Lock
    // works and gives older webOS browsers another way to remain active.
    startVideoFallback();

    const ok = await requestWakeLock();

    if (!ok) {
      scheduleWakeLockRetry();
    }

    // Periodically check both mechanisms while the page remains visible.
    if (!wakeLockWatchTimer) {
      wakeLockWatchTimer = setInterval(() => {
        if (document.visibilityState !== 'visible') return;

        if (!wakeLock || wakeLock.released) {
          requestWakeLock();
        }

        const v = document.getElementById('wakeVideo');
        if (v && v.paused) {
          v.play().catch(() => {});
        }
      }, WAKE_LOCK_WATCH_MS);
    }
  }

  // Wake Lock is normally released when the page is hidden. Re-acquire it
  // when webOS makes the page visible again.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      startVideoFallback();
      requestWakeLock();
    }
  });

  // If the TV/browser suspends the page and later restores it, retry.
  window.addEventListener('pageshow', () => {
    startVideoFallback();
    requestWakeLock();
  });

  loadSheet();
  setupRemote();
  initWakeLock();
})();
</script>
</body>
</html>
