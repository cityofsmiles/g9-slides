<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Grade 9 Math Lessons — KasaMath Hub</title>
<style>
  :root{
    --ink:#121417;
    --ink-2:#1b1e23;
    --ink-3:#262a31;
    --paper:#eef0ee;
    --paper-dim:#9aa3a8;
    --chalk:#e8b94e;
    --chalk-dim:#7a6329;
    --slate:#5ec9c0;
    --danger:#e0654f;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--ink); color:var(--paper);
    font-family:var(--sans); overscroll-behavior:none;
  }
  #app{position:fixed; inset:0; overflow:hidden;}

  /* ---------- Library screen ---------- */
  #library{
    position:absolute; inset:0; overflow-y:auto;
    padding: max(28px, env(safe-area-inset-top)) 20px 40px;
    display:flex; flex-direction:column;
  }
  .brand{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:22px; padding-bottom:16px; border-bottom:1px solid var(--ink-3);
  }
  .brand h1{
    font-size:20px; margin:0; font-weight:700; letter-spacing:0.01em; color:var(--paper);
  }
  .brand h1 span{color:var(--chalk);}
  .brand small{font-family:var(--mono); color:var(--paper-dim); font-size:11px;}

  #termTabs{display:flex; gap:6px; margin-bottom:16px;}
  .term-tab{
    flex:1; text-align:center; font-family:var(--mono); font-size:12px; letter-spacing:0.03em;
    background:var(--ink-2); border:1px solid var(--ink-3); color:var(--paper-dim);
    padding:9px 6px; border-radius:7px; cursor:pointer;
  }
  .term-tab.active{border-color:var(--chalk-dim); color:var(--chalk); background:var(--ink-3);}
  .term-tab.failed{color:var(--danger); opacity:0.6;}

  #search{
    width:100%; background:var(--ink-2); border:1px solid var(--ink-3); color:var(--paper);
    padding:12px 14px; border-radius:8px; font-size:15px; margin-bottom:18px; font-family:var(--sans);
  }
  #search:focus{outline:none; border-color:var(--chalk-dim);}
  #search::placeholder{color:var(--paper-dim);}

  #status{
    font-family:var(--mono); font-size:12px; color:var(--paper-dim);
    padding:14px 0; display:flex; align-items:center; gap:8px;
  }
  #status.err{color:var(--danger);}
  #status button{
    background:none; border:1px solid var(--ink-3); color:var(--paper); border-radius:6px;
    padding:5px 10px; font-family:var(--mono); font-size:11px; cursor:pointer; margin-left:6px;
  }
  #status button:hover{border-color:var(--chalk-dim); color:var(--chalk);}

  #list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px;}
  .row{
    display:flex; align-items:center; gap:14px;
    padding:16px 4px; border-bottom:1px solid var(--ink-2);
    cursor:pointer; background:transparent; transition:background 0.12s;
  }
  .row:active, .row:hover{background:var(--ink-2);}
  .row .num{
    font-family:var(--mono); font-size:13px; color:var(--chalk); min-width:52px;
    flex-shrink:0;
  }
  .row .title{font-size:16px; color:var(--paper); flex:1; line-height:1.3;}
  .row .go{color:var(--paper-dim); font-size:18px; flex-shrink:0;}
  .row.hidden{display:none;}

  .empty{color:var(--paper-dim); font-size:13px; padding:20px 4px; font-family:var(--mono);}

  /* ---------- Viewer screen ---------- */
  #viewer{
    position:absolute; inset:0; background:#000; display:none;
    align-items:center; justify-content:center; touch-action:none;
  }
  #viewer.active{display:flex;}
  #slideImg{
    max-width:100%; max-height:100%; width:auto; height:auto; user-select:none;
    -webkit-user-drag:none; object-fit:contain;
  }
  #slideImg.hidden{visibility:hidden;}

  .zone{position:absolute; top:0; bottom:0; width:35%; z-index:5;}
  .zone.left{left:0;}
  .zone.right{right:0;}

  #hud{
    position:absolute; inset:0; z-index:10; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    opacity:1; transition:opacity 0.35s;
  }
  #hud.dim{opacity:0;}
  .hud-top{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding: max(16px, env(safe-area-inset-top)) 16px 24px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
    pointer-events:auto;
  }
  .hud-top .lesson-title{
    font-size:14px; color:var(--paper); font-weight:600; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .hud-btn{
    background:rgba(255,255,255,0.08); border:none; color:var(--paper);
    width:36px; height:36px; border-radius:8px; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .hud-btn:active{background:rgba(255,255,255,0.18);}
  .hud-bottom{
    display:flex; align-items:center; justify-content:center; gap:16px;
    padding: 20px 16px max(20px, env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    pointer-events:auto;
  }
  #counter{font-family:var(--mono); font-size:13px; color:var(--paper-dim); letter-spacing:0.02em;}
  #counter b{color:var(--chalk); font-weight:600;}

  #remoteDot{
    width:8px; height:8px; border-radius:50%; background:var(--ink-3);
    flex-shrink:0; margin-right:2px;
  }
  #remoteDot.connected{background:var(--slate);}
  #remoteDot.error{background:var(--danger);}

  #loading{
    position:absolute; inset:0; z-index:15; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:10px;
    background:#000; color:var(--paper-dim); font-family:var(--mono); font-size:12px;
  }
  #loading.active{display:flex;}
  .spinner{
    width:22px; height:22px; border-radius:50%;
    border:2px solid var(--ink-3); border-top-color:var(--chalk);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  #viewerEmpty{
    position:absolute; inset:0; z-index:15; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:10px;
    background:#000; color:var(--paper-dim); text-align:center; padding:30px;
  }
  #viewerEmpty.active{display:flex;}
  #viewerEmpty .big{color:var(--danger); font-size:14px; font-family:var(--mono);}
  #viewerEmpty button{
    margin-top:8px; background:var(--ink-2); border:1px solid var(--ink-3); color:var(--paper);
    padding:9px 16px; border-radius:8px; font-family:var(--mono); font-size:12px; cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){
    #hud, .spinner{transition:none; animation:none;}
  }
</style>
</head>
<body>

<div id="app">

  <!-- LIBRARY -->
  <div id="library">
    <div class="brand">
      <h1>Grade 9 <span>Math Lessons</span></h1>
      <small id="count-badge"></small>
    </div>
    <div id="termTabs"></div>
    <input id="search" type="text" placeholder="Search lessons…" autocomplete="off">
    <div id="status">Loading lesson list…</div>
    <ul id="list"></ul>
  </div>

  <!-- VIEWER -->
  <div id="viewer">
    <img id="slideImg" alt="Slide">
    <div class="zone left" id="zoneLeft"></div>
    <div class="zone right" id="zoneRight"></div>

    <div id="loading"><div class="spinner"></div><div>finding slides…</div></div>
    <div id="viewerEmpty">
      <div class="big">No slides found in this folder</div>
      <div id="viewerEmptyDetail" style="font-family:var(--mono); font-size:11px;"></div>
      <button id="backFromEmpty">Back to list</button>
    </div>

    <div id="hud">
      <div class="hud-top">
        <button class="hud-btn" id="btnClose" aria-label="Close">✕</button>
        <div class="lesson-title" id="hudTitle"></div>
        <span id="remoteDot" title="Kindle remote connection"></span>
        <button class="hud-btn" id="btnFullscreen" aria-label="Fullscreen">⛶</button>
      </div>
      <div class="hud-bottom">
        <span id="counter"><b id="curNum">0</b> / <span id="totalNum">0</span></span>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  'use strict';

  // ---------------- CONFIG ----------------
  // Edit these if you reuse this file for a different sheet or set of tabs.
  const SHEET_ID  = '1M_8gqOK-OUJ2bPeMU0fgYfx5k9lJBFT9ZRA59tGoJ4c';   
  const TERMS = ['Term1', 'Term2', 'Term3'];  // must match your sheet tab names exactly
  const MAX_SLIDES_TO_PROBE = 80;  // safety ceiling per lesson
  const HUD_HIDE_DELAY = 2600;     // ms of inactivity before HUD fades in viewer

  // Remote control (Kindle) — must match REMOTE_TOPIC in kindle-remote.html exactly.
  // ntfy.sh topics are unauthenticated and public if guessed, so pick something
  // obscure rather than leaving the default.
  const REMOTE_TOPIC = 'kasamath-g9-slides-9f3k2';
  const ENABLE_REMOTE = true;
  // -----------------------------------------

  function csvUrlForTerm(term){
    return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(term)}`;
  }

  const el = (id) => document.getElementById(id);
  const statusEl = el('status'), listEl = el('list'), searchEl = el('search'), countBadge = el('count-badge');
  const termTabsEl = el('termTabs');
  const viewer = el('viewer'), library = el('library'), slideImg = el('slideImg');
  const hud = el('hud'), hudTitle = el('hudTitle'), curNum = el('curNum'), totalNum = el('totalNum');
  const loadingEl = el('loading'), emptyEl = el('viewerEmpty'), emptyDetail = el('viewerEmptyDetail');

  let lessons = [];          // all terms combined: {term, number, title, folderPath}
  let termStatus = {};        // term -> 'ok' | 'failed'
  let activeTerm = TERMS[0];
  let slideCache = {};        // folderPath -> [urls]
  let current = { urls: [], index: 0, title: '' };
  let hudTimer = null;

  // ---------- CSV parsing (handles quoted fields) ----------
  function parseCSV(text){
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i], next = text[i+1];
      if (inQuotes){
        if (c === '"' && next === '"'){ field += '"'; i++; }
        else if (c === '"'){ inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"'){ inQuotes = true; }
        else if (c === ','){ row.push(field); field = ''; }
        else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
        else if (c === '\r'){ /* skip */ }
        else { field += c; }
      }
    }
    if (field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(f => f.trim() !== ''));
  }

  function extractLessonNumber(title, folderPath){
    // Prefer a dotted numeric run from the folder path (e.g. .../1.07.1) —
    // falls back to scanning the title if the path doesn't have one.
    let m = folderPath.match(/([0-9]+(?:\.[0-9]+)+)/);
    if (m) return m[1];
    m = title.match(/([0-9]+(?:\.[0-9]+)+)/);
    return m ? m[1] : '';
  }

  function githubTreeToRawBase(treeUrl){
    // https://github.com/OWNER/REPO/tree/BRANCH/path/to/folder
    //   -> https://raw.githubusercontent.com/OWNER/REPO/BRANCH/path/to/folder/
    const m = treeUrl.match(/github\.com\/([^\/]+)\/([^\/]+)\/tree\/([^\/]+)\/(.+?)\/?$/);
    if (!m) return null;
    const [, owner, repo, branch, path] = m;
    return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}/`;
  }

  function loadImage(url){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(url);
      img.onerror = () => reject(url);
      img.src = url;
    });
  }

  async function probeSlides(folderPath){
    if (slideCache[folderPath]) return slideCache[folderPath];
    const base = githubTreeToRawBase(folderPath);
    if (!base) throw new Error('not-a-github-tree-url');
    const found = [];
    for (let n = 1; n <= MAX_SLIDES_TO_PROBE; n++){
      const padded = String(n).padStart(2, '0');
      const url = `${base}slide-${padded}.png`;
      try {
        await loadImage(url);
        found.push(url);
      } catch (e) {
        break; // first miss = end of sequence (matches the conversion script's numbering)
      }
    }
    slideCache[folderPath] = found;
    return found;
  }

  // ---------- Library rendering ----------
  function renderTabs(){
    termTabsEl.innerHTML = '';
    TERMS.forEach(term => {
      const btn = document.createElement('div');
      btn.className = 'term-tab' + (term === activeTerm ? ' active' : '') + (termStatus[term] === 'failed' ? ' failed' : '');
      btn.textContent = term;
      btn.addEventListener('click', () => {
        if (term === activeTerm) return;
        activeTerm = term;
        searchEl.value = '';
        renderTabs();
        renderList();
      });
      termTabsEl.appendChild(btn);
    });
  }

  function visibleLessons(){
    return lessons.filter(l => l.term === activeTerm);
  }

  function renderList(){
    listEl.innerHTML = '';
    const termLessons = visibleLessons();
    if (!termLessons.length){
      const msg = termStatus[activeTerm] === 'failed'
        ? `Couldn't load the "${activeTerm}" tab.`
        : `No lessons found in "${activeTerm}".`;
      listEl.innerHTML = `<li class="empty">${msg}</li>`;
      countBadge.textContent = '';
      return;
    }
    termLessons.forEach((lesson) => {
      const li = document.createElement('li');
      li.className = 'row';
      li.innerHTML = `<span class="num">${lesson.number || '—'}</span><span class="title">${escapeHtml(lesson.title)}</span><span class="go">›</span>`;
      li.addEventListener('click', () => openLessonData(lesson));
      listEl.appendChild(li);
    });
    countBadge.textContent = `${termLessons.length} lesson${termLessons.length === 1 ? '' : 's'}`;
    filterList(searchEl.value);
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function filterList(q){
    q = q.trim().toLowerCase();
    const termLessons = visibleLessons();
    document.querySelectorAll('#list .row').forEach((row, i) => {
      const lesson = termLessons[i];
      if (!lesson) return;
      const match = !q || lesson.title.toLowerCase().includes(q) || lesson.number.includes(q);
      row.classList.toggle('hidden', !match);
    });
  }

  searchEl.addEventListener('input', () => filterList(searchEl.value));

  // ---------- Load sheet ----------
  async function loadSheet(){
    statusEl.textContent = 'Loading lesson list…';
    statusEl.className = '';
    renderTabs();

    const results = await Promise.all(TERMS.map(async (term) => {
      try {
        const res = await fetch(csvUrlForTerm(term));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const rows = parseCSV(text);
        if (!rows.length) throw new Error('empty');
        const dataRows = rows.slice(1); // skip header
        const termLessons = dataRows
          .map(r => ({ title: (r[0] || '').trim(), folderPath: (r[1] || '').trim() }))
          .filter(l => l.title && l.folderPath)
          .map(l => ({ ...l, term, number: extractLessonNumber(l.title, l.folderPath) }));
        termStatus[term] = 'ok';
        return termLessons;
      } catch (err) {
        termStatus[term] = 'failed';
        return [];
      }
    }));

    lessons = results.flat();
    const anyFailed = TERMS.some(t => termStatus[t] === 'failed');
    const anyOk = TERMS.some(t => termStatus[t] === 'ok');

    if (!anyOk){
      statusEl.className = 'err';
      statusEl.innerHTML = `Couldn't load any lesson tabs. Make sure the sheet is shared as "Anyone with the link can view" and that tab names match ${TERMS.join(', ')}. <button id="retryBtn">Retry</button>`;
      el('retryBtn').addEventListener('click', loadSheet);
      renderTabs();
      renderList();
      return;
    }

    statusEl.textContent = anyFailed ? `Some tabs failed to load (marked in red above).` : '';
    statusEl.className = anyFailed ? 'err' : '';
    renderTabs();
    renderList();
  }

  // ---------- Viewer ----------
  async function openLessonData(lesson){
    if (!lesson || !lesson.folderPath) return;
    current.title = lesson.title;
    hudTitle.textContent = lesson.title;
    viewer.classList.add('active');
    library.style.display = 'none';
    loadingEl.classList.add('active');
    emptyEl.classList.remove('active');
    slideImg.classList.add('hidden');

    let urls;
    try {
      urls = await probeSlides(lesson.folderPath);
    } catch (e) {
      urls = [];
    }
    loadingEl.classList.remove('active');

    if (!urls.length){
      emptyDetail.textContent = lesson.folderPath;
      emptyEl.classList.add('active');
      return;
    }

    current.urls = urls;
    current.index = 0;
    totalNum.textContent = urls.length;
    showSlide(0);
    attemptFullscreen();
    scheduleHudHide();
  }

  function showSlide(i){
    if (i < 0 || i >= current.urls.length) return;
    current.index = i;
    slideImg.src = current.urls[i];
    slideImg.classList.remove('hidden');
    curNum.textContent = i + 1;
    // preload neighbors
    [i-1, i+1, i+2].forEach(n => {
      if (n >= 0 && n < current.urls.length){
        const pre = new Image();
        pre.src = current.urls[n];
      }
    });
  }

  function nextSlide(){ if (current.index < current.urls.length - 1) showSlide(current.index + 1); wakeHud(); }
  function prevSlide(){ if (current.index > 0) showSlide(current.index - 1); wakeHud(); }

  function closeViewer(){
    viewer.classList.remove('active');
    library.style.display = '';
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    clearTimeout(hudTimer);
  }

  function attemptFullscreen(){
    const req = viewer.requestFullscreen || viewer.webkitRequestFullscreen;
    if (req) req.call(viewer).catch(() => {});
  }

  function toggleFullscreen(){
    if (document.fullscreenElement){
      document.exitFullscreen().catch(() => {});
    } else {
      attemptFullscreen();
    }
  }

  function wakeHud(){
    hud.classList.remove('dim');
    scheduleHudHide();
  }
  function scheduleHudHide(){
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => hud.classList.add('dim'), HUD_HIDE_DELAY);
  }

  // ---------- Events ----------
  el('zoneLeft').addEventListener('click', prevSlide);
  el('zoneRight').addEventListener('click', nextSlide);
  el('btnClose').addEventListener('click', closeViewer);
  el('btnFullscreen').addEventListener('click', toggleFullscreen);
  el('backFromEmpty').addEventListener('click', closeViewer);
  viewer.addEventListener('mousemove', wakeHud);

  document.addEventListener('keydown', (e) => {
    if (!viewer.classList.contains('active')) return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
    else if (e.key === 'ArrowLeft') { prevSlide(); }
    else if (e.key === 'Escape') { closeViewer(); }
    else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
  });

  // touch swipe
  let touchStartX = null, touchStartY = null;
  viewer.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  viewer.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
      if (dx < 0) nextSlide(); else prevSlide();
    }
    touchStartX = null; touchStartY = null;
  }, { passive: true });

  // ---------- Kindle remote (ntfy.sh) ----------
  const remoteDot = el('remoteDot');

  function setupRemote(){
    if (!ENABLE_REMOTE || !REMOTE_TOPIC) return;
    let es;
    function connect(){
      try {
        es = new EventSource(`https://ntfy.sh/${REMOTE_TOPIC}/sse`);
      } catch (e) {
        remoteDot.className = 'error';
        return;
      }
      es.onopen = () => { remoteDot.className = 'connected'; };
      es.onerror = () => { remoteDot.className = 'error'; };
      es.onmessage = (e) => {
        let payload;
        try { payload = JSON.parse(e.data); } catch (err) { return; }
        if (!payload || !payload.message) return;
        let cmd;
        try { cmd = JSON.parse(payload.message); } catch (err) { return; }
        handleRemoteCommand(cmd);
      };
    }
    connect();
  }

  function handleRemoteCommand(cmd){
    if (!cmd || !cmd.action) return;
    switch (cmd.action){
      case 'open':
        openLessonData({ title: cmd.title || '', folderPath: cmd.folderPath || '' });
        break;
      case 'next':
        nextSlide();
        break;
      case 'prev':
        prevSlide();
        break;
      case 'goto':
        if (typeof cmd.index === 'number') showSlide(cmd.index);
        wakeHud();
        break;
      case 'close':
        closeViewer();
        break;
    }
  }

  loadSheet();
  setupRemote();
})();
</script>
</body>
</html>
